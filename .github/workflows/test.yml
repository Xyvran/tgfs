name: Test and Coverage

on:
  # Every branch, so a feature branch is validated before it reaches a
  # pull request -- not only master.
  push:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
        
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
      
    - name: Install project
      run: poetry install --no-interaction
      
    - name: Run type checks
      run: |
        poetry run python -m mypy . --follow-untyped-imports --check-untyped-defs
        
    - name: Run code style checks  
      run: |
        poetry run python -m ruff check . --exclude tests
        
    - name: Run tests with coverage
      env:
        TGFS_DATA_DIR: .
        TGFS_CONFIG_FILE: config-test.yaml
      run: |
        poetry run pytest --cov --cov-branch --cov-report=xml

    # Only where it ran before this workflow was widened to all branches, so a
    # coverage upload cannot redden a feature branch.
    - name: Upload coverage reports to Codecov
      if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: TheodoreKrypton/tgfs